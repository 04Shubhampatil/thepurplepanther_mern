<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#3a1651" />

    <title>The Purple Panther</title>
    <meta name="description" content="The Purple Panther — beyond ordinary." />

    <!--
      No legacy stylesheets.

      The Laravel theme loaded Bootstrap, Font Awesome, Flaticon, animate.css, Swiper CSS,
      Magnific Popup, style.css, custom.css, custome-css.css, site-drawers.css,
      journal.css and beyond-ordinary.css — roughly 2.3MB of CSS plus 8.7MB of icon fonts.
      All of it is replaced by Tailwind, lucide-react and Motion. Styles are imported
      through src/index.css so Vite can process and tree-shake them.

      The theme's IMAGE assets are still served from the API at /frontend, because those
      are real product and editorial photography, not styling.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
